# Populates the environment Key Vault from protected pipeline variables.
# Credential values must be marked secret in the Azure Pipelines UI.
trigger: none
pr: none

name: "Oluto Secrets Setup"

parameters:
  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values: [dev, prod]
  - name: modelBaseUrl
    displayName: OpenAI-compatible base URL
    type: string
  - name: primaryModel
    displayName: Primary text and vision model
    type: string
  - name: embeddingModel
    displayName: Embedding model on the same endpoint
    type: string
  - name: modelConfigurationId
    displayName: Immutable UUIDv7 model configuration ID
    type: string
  - name: agentDatabaseHost
    displayName: Oluto Finance PostgreSQL host
    type: string
  - name: agentDatabasePort
    displayName: Oluto Finance PostgreSQL port
    type: string
    default: "5432"
  - name: agentDatabaseName
    displayName: Oluto Finance PostgreSQL database
    type: string
    default: oluto_agent
  - name: temporalAddress
    displayName: Temporal frontend address
    type: string
  - name: blobstoreInternalEndpoint
    displayName: S3-compatible internal endpoint
    type: string
  - name: blobstorePublicEndpoint
    displayName: S3-compatible public endpoint
    type: string

variables:
  azureServiceConnection: terraformiacdevops1

stages:
  - stage: Setup_Secrets
    displayName: "Setup Secrets (${{ parameters.environment }})"
    jobs:
      - job: Populate_KeyVault
        pool:
          vmImage: ubuntu-24.04
        steps:
          - task: AzureCLI@2
            displayName: Populate and verify Key Vault
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                vault="wackopscoach-${{ parameters.environment }}-kv"

                put() {
                  az keyvault secret set --vault-name "$vault" --name "$1" --value "$2" --output none
                }

                required_variables=(
                  OLUTO_DATABASE_URL
                  OLUTO_FUELIX_API_KEY
                  OLUTO_FUELIX_BASE_URL
                  OLUTO_FUELIX_MODEL
                  KEYCLOAK_DATABASE_URL
                  KEYCLOAK_DB_USERNAME
                  KEYCLOAK_DB_PASSWORD
                  KEYCLOAK_ADMIN_PASSWORD
                  OLUTO_AGENT_MIGRATOR_USER
                  OLUTO_AGENT_MIGRATOR_PASSWORD
                  OLUTO_AGENT_RUNTIME_USER
                  OLUTO_AGENT_RUNTIME_PASSWORD
                  OLUTO_AGENT_DISPATCHER_USER
                  OLUTO_AGENT_DISPATCHER_PASSWORD
                  OLUTO_AGENT_WORKER_USER
                  OLUTO_AGENT_WORKER_PASSWORD
                  OLUTO_FINANCE_SERVICE_SECRET
                  OLUTO_MODEL_API_KEY
                  OLUTO_BLOBSTORE_ACCESS_KEY
                  OLUTO_BLOBSTORE_SECRET_KEY
                )
                for variable in "${required_variables[@]}"; do
                  if [ -z "${!variable:-}" ]; then
                    echo "Required protected pipeline variable is missing: $variable"
                    exit 1
                  fi
                done

                put oluto-database-url "$OLUTO_DATABASE_URL"
                put oluto-fuelix-api-key "$OLUTO_FUELIX_API_KEY"
                put oluto-fuelix-base-url "$OLUTO_FUELIX_BASE_URL"
                put oluto-fuelix-model "$OLUTO_FUELIX_MODEL"
                put keycloak-database-url "$KEYCLOAK_DATABASE_URL"
                put keycloak-db-username "$KEYCLOAK_DB_USERNAME"
                put keycloak-db-password "$KEYCLOAK_DB_PASSWORD"
                put keycloak-admin-password "$KEYCLOAK_ADMIN_PASSWORD"

                put oluto-agent-database-host '${{ parameters.agentDatabaseHost }}'
                put oluto-agent-database-port '${{ parameters.agentDatabasePort }}'
                put oluto-agent-database-name '${{ parameters.agentDatabaseName }}'
                put oluto-temporal-address '${{ parameters.temporalAddress }}'
                put oluto-agent-migrator-user "$OLUTO_AGENT_MIGRATOR_USER"
                put oluto-agent-migrator-password "$OLUTO_AGENT_MIGRATOR_PASSWORD"
                put oluto-agent-runtime-user "$OLUTO_AGENT_RUNTIME_USER"
                put oluto-agent-runtime-password "$OLUTO_AGENT_RUNTIME_PASSWORD"
                put oluto-agent-dispatcher-user "$OLUTO_AGENT_DISPATCHER_USER"
                put oluto-agent-dispatcher-password "$OLUTO_AGENT_DISPATCHER_PASSWORD"
                put oluto-agent-worker-user "$OLUTO_AGENT_WORKER_USER"
                put oluto-agent-worker-password "$OLUTO_AGENT_WORKER_PASSWORD"
                put oluto-finance-service-secret "$OLUTO_FINANCE_SERVICE_SECRET"

                put oluto-model-base-url '${{ parameters.modelBaseUrl }}'
                put oluto-model-api-key "$OLUTO_MODEL_API_KEY"
                put oluto-primary-model '${{ parameters.primaryModel }}'
                put oluto-embedding-model '${{ parameters.embeddingModel }}'
                put oluto-model-configuration-id '${{ parameters.modelConfigurationId }}'

                put oluto-blobstore-internal-endpoint '${{ parameters.blobstoreInternalEndpoint }}'
                put oluto-blobstore-public-endpoint '${{ parameters.blobstorePublicEndpoint }}'
                put oluto-blobstore-access-key "$OLUTO_BLOBSTORE_ACCESS_KEY"
                put oluto-blobstore-secret-key "$OLUTO_BLOBSTORE_SECRET_KEY"

                expected=(
                  oluto-agent-database-host
                  oluto-agent-database-port
                  oluto-agent-database-name
                  oluto-temporal-address
                  oluto-agent-migrator-user
                  oluto-agent-migrator-password
                  oluto-agent-runtime-user
                  oluto-agent-runtime-password
                  oluto-agent-dispatcher-user
                  oluto-agent-dispatcher-password
                  oluto-agent-worker-user
                  oluto-agent-worker-password
                  oluto-finance-service-secret
                  oluto-model-base-url
                  oluto-model-api-key
                  oluto-primary-model
                  oluto-embedding-model
                  oluto-model-configuration-id
                  oluto-blobstore-internal-endpoint
                  oluto-blobstore-public-endpoint
                  oluto-blobstore-access-key
                  oluto-blobstore-secret-key
                )
                for secret in "${expected[@]}"; do
                  az keyvault secret show --vault-name "$vault" --name "$secret" --query name -o tsv >/dev/null
                  echo "$secret: OK"
                done
            env:
              OLUTO_DATABASE_URL: $(oluto-database-url)
              OLUTO_FUELIX_API_KEY: $(oluto-fuelix-api-key)
              OLUTO_FUELIX_BASE_URL: $(oluto-fuelix-base-url)
              OLUTO_FUELIX_MODEL: $(oluto-fuelix-model)
              KEYCLOAK_DATABASE_URL: $(keycloak-database-url)
              KEYCLOAK_DB_USERNAME: $(keycloak-db-username)
              KEYCLOAK_DB_PASSWORD: $(keycloak-db-password)
              KEYCLOAK_ADMIN_PASSWORD: $(keycloak-admin-password)
              OLUTO_AGENT_MIGRATOR_USER: $(oluto-agent-migrator-user)
              OLUTO_AGENT_MIGRATOR_PASSWORD: $(oluto-agent-migrator-password)
              OLUTO_AGENT_RUNTIME_USER: $(oluto-agent-runtime-user)
              OLUTO_AGENT_RUNTIME_PASSWORD: $(oluto-agent-runtime-password)
              OLUTO_AGENT_DISPATCHER_USER: $(oluto-agent-dispatcher-user)
              OLUTO_AGENT_DISPATCHER_PASSWORD: $(oluto-agent-dispatcher-password)
              OLUTO_AGENT_WORKER_USER: $(oluto-agent-worker-user)
              OLUTO_AGENT_WORKER_PASSWORD: $(oluto-agent-worker-password)
              OLUTO_FINANCE_SERVICE_SECRET: $(oluto-finance-service-secret)
              OLUTO_MODEL_API_KEY: $(oluto-model-api-key)
              OLUTO_BLOBSTORE_ACCESS_KEY: $(oluto-blobstore-access-key)
              OLUTO_BLOBSTORE_SECRET_KEY: $(oluto-blobstore-secret-key)
