# =============================================================================
# ExternalSecret - Fetches Oluto secrets from Azure Key Vault (PROD)
# Syncs secrets from Key Vault to Kubernetes native secret
# =============================================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oluto-secrets
  namespace: oluto
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: oluto-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # LedgerForge backend (Rust/Axum)
        DATABASE_URL: "{{ .oluto_database_url }}"

        # AI Categorization
        FUELIX_API_KEY: "{{ .oluto_fuelix_api_key }}"
        FUELIX_BASE_URL: "{{ .oluto_fuelix_base_url }}"
        FUELIX_MODEL: "{{ .oluto_fuelix_model }}"

        # Azure OCR (PDF import)
        AZURE_API_KEY: "{{ .oluto_azure_api_key }}"
        AZURE_OCR_URL: "{{ .oluto_azure_ocr_url }}"
        AZURE_OCR_MODEL: "{{ .oluto_azure_ocr_model }}"

        # Azure Blob Storage (receipt upload)
        AZURE_STORAGE_CONNECTION_STRING: "{{ .azure_storage_connection_string }}"
        AZURE_STORAGE_CONTAINER_PREFIX: "{{ .azure_storage_container_prefix }}"

        # Keycloak (OIDC identity provider)
        KEYCLOAK_DB_URL: "{{ .keycloak_database_url }}"
        KEYCLOAK_DB_USERNAME: "{{ .keycloak_db_username }}"
        KEYCLOAK_DB_PASSWORD: "{{ .keycloak_db_password }}"
        KEYCLOAK_ADMIN_PASSWORD: "{{ .keycloak_admin_password }}"
        # Oluto Finance runtime isolation and provider-neutral model access
        OLUTO_DATABASE_HOST: "{{ .oluto_agent_database_host }}"
        OLUTO_DATABASE_PORT: "{{ .oluto_agent_database_port }}"
        OLUTO_DATABASE_NAME: "{{ .oluto_agent_database_name }}"
        OLUTO_TEMPORAL_ADDRESS: "{{ .oluto_temporal_address }}"
        OLUTO_AGENT_MIGRATOR_USER: "{{ .oluto_agent_migrator_user }}"
        OLUTO_AGENT_MIGRATOR_PASSWORD: "{{ .oluto_agent_migrator_password }}"
        OLUTO_AGENT_RUNTIME_USER: "{{ .oluto_agent_runtime_user }}"
        OLUTO_AGENT_RUNTIME_PASSWORD: "{{ .oluto_agent_runtime_password }}"
        OLUTO_AGENT_DISPATCHER_USER: "{{ .oluto_agent_dispatcher_user }}"
        OLUTO_AGENT_DISPATCHER_PASSWORD: "{{ .oluto_agent_dispatcher_password }}"
        OLUTO_AGENT_WORKER_USER: "{{ .oluto_agent_worker_user }}"
        OLUTO_AGENT_WORKER_PASSWORD: "{{ .oluto_agent_worker_password }}"
        OLUTO_FINANCE_SERVICE_SECRET: "{{ .oluto_finance_service_secret }}"
        OLUTO_MODEL_BASE_URL: "{{ .oluto_model_base_url }}"
        OLUTO_MODEL_API_KEY: "{{ .oluto_model_api_key }}"
        OLUTO_PRIMARY_MODEL: "{{ .oluto_primary_model }}"
        OLUTO_EMBEDDING_MODEL: "{{ .oluto_embedding_model }}"
        OLUTO_MODEL_CONFIGURATION_ID: "{{ .oluto_model_configuration_id }}"
        OLUTO_BLOBSTORE_INTERNAL_ENDPOINT: "{{ .oluto_blobstore_internal_endpoint }}"
        OLUTO_BLOBSTORE_PUBLIC_ENDPOINT: "{{ .oluto_blobstore_public_endpoint }}"
        OLUTO_BLOBSTORE_ACCESS_KEY: "{{ .oluto_blobstore_access_key }}"
        OLUTO_BLOBSTORE_SECRET_KEY: "{{ .oluto_blobstore_secret_key }}"

  data:
    - secretKey: oluto_database_url
      remoteRef:
        key: oluto-database-url

    - secretKey: oluto_fuelix_api_key
      remoteRef:
        key: oluto-fuelix-api-key

    - secretKey: oluto_fuelix_base_url
      remoteRef:
        key: oluto-fuelix-base-url

    - secretKey: oluto_fuelix_model
      remoteRef:
        key: oluto-fuelix-model

    - secretKey: oluto_azure_api_key
      remoteRef:
        key: oluto-azure-api-key

    - secretKey: oluto_azure_ocr_url
      remoteRef:
        key: oluto-azure-ocr-url

    - secretKey: oluto_azure_ocr_model
      remoteRef:
        key: oluto-azure-ocr-model

    - secretKey: azure_storage_connection_string
      remoteRef:
        key: azure-storage-connection-string

    - secretKey: azure_storage_container_prefix
      remoteRef:
        key: azure-storage-container-prefix

    - secretKey: keycloak_database_url
      remoteRef:
        key: keycloak-database-url

    - secretKey: keycloak_db_username
      remoteRef:
        key: keycloak-db-username

    - secretKey: keycloak_db_password
      remoteRef:
        key: keycloak-db-password

    - secretKey: keycloak_admin_password
      remoteRef:
        key: keycloak-admin-password

    - secretKey: oluto_agent_database_host
      remoteRef:
        key: oluto-agent-database-host
    - secretKey: oluto_agent_database_port
      remoteRef:
        key: oluto-agent-database-port
    - secretKey: oluto_agent_database_name
      remoteRef:
        key: oluto-agent-database-name
    - secretKey: oluto_temporal_address
      remoteRef:
        key: oluto-temporal-address
    - secretKey: oluto_agent_migrator_user
      remoteRef:
        key: oluto-agent-migrator-user
    - secretKey: oluto_agent_migrator_password
      remoteRef:
        key: oluto-agent-migrator-password
    - secretKey: oluto_agent_runtime_user
      remoteRef:
        key: oluto-agent-runtime-user
    - secretKey: oluto_agent_runtime_password
      remoteRef:
        key: oluto-agent-runtime-password
    - secretKey: oluto_agent_dispatcher_user
      remoteRef:
        key: oluto-agent-dispatcher-user
    - secretKey: oluto_agent_dispatcher_password
      remoteRef:
        key: oluto-agent-dispatcher-password
    - secretKey: oluto_agent_worker_user
      remoteRef:
        key: oluto-agent-worker-user
    - secretKey: oluto_agent_worker_password
      remoteRef:
        key: oluto-agent-worker-password
    - secretKey: oluto_finance_service_secret
      remoteRef:
        key: oluto-finance-service-secret
    - secretKey: oluto_model_base_url
      remoteRef:
        key: oluto-model-base-url
    - secretKey: oluto_model_api_key
      remoteRef:
        key: oluto-model-api-key
    - secretKey: oluto_primary_model
      remoteRef:
        key: oluto-primary-model
    - secretKey: oluto_embedding_model
      remoteRef:
        key: oluto-embedding-model
    - secretKey: oluto_model_configuration_id
      remoteRef:
        key: oluto-model-configuration-id
    - secretKey: oluto_blobstore_internal_endpoint
      remoteRef:
        key: oluto-blobstore-internal-endpoint
    - secretKey: oluto_blobstore_public_endpoint
      remoteRef:
        key: oluto-blobstore-public-endpoint
    - secretKey: oluto_blobstore_access_key
      remoteRef:
        key: oluto-blobstore-access-key
    - secretKey: oluto_blobstore_secret_key
      remoteRef:
        key: oluto-blobstore-secret-key
