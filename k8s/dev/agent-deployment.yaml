---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oluto-finance-api
  namespace: oluto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oluto-finance-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oluto-finance-worker
  namespace: oluto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oluto-finance-worker
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oluto-finance-api
  namespace: oluto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oluto-finance-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oluto-finance-worker
  namespace: oluto
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: oluto-finance-worker
