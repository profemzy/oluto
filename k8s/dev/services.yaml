# =============================================================================
# Backend Service (LedgerForge — Rust/Axum on port 3000)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: oluto-backend
  namespace: oluto
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
    - port: 3002
      targetPort: 3002
      protocol: TCP
      name: delegated-http
  selector:
    app: oluto-backend
---
# =============================================================================
# Frontend Service (Next.js on port 3000)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: oluto-frontend
  namespace: oluto
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: oluto-frontend
---
# =============================================================================
# Oluto Finance Agent API
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: oluto-finance-api
  namespace: oluto
spec:
  type: ClusterIP
  ports:
    - port: 18790
      targetPort: 18790
      protocol: TCP
      name: http
  selector:
    app: oluto-finance-api
---
# =============================================================================
# Keycloak Service (OIDC identity provider on port 8080)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: oluto
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: keycloak
